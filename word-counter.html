<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Word Counter — TechFixZone Tools</title>
  <meta name="description" content="Free online word counter. Count words, characters, sentences, and paragraphs in real time. No signup required."/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://techfixzone-hub.github.io/Tools/word-counter.html"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--border:#1e1e2e;--accent:#00e5ff;--text:#e2e2f0;--muted:#6b6b8a;--card:#13131c;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
    header{position:relative;z-index:10;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);padding:0 24px;}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
    .logo{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
    .logo-badge{background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
    .back-link{font-size:13px;color:var(--muted);text-decoration:none;font-family:'Space Mono',monospace;}
    .back-link:hover{color:var(--accent);}
    .page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 24px 80px;}
    .page-title{font-family:'Space Mono',monospace;font-size:clamp(22px,4vw,36px);font-weight:700;color:#fff;margin-bottom:8px;}
    .page-title span{color:var(--accent);}
    .page-desc{font-size:15px;color:var(--muted);margin-bottom:36px;}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
    .stat-num{font-family:'Space Mono',monospace;font-size:28px;font-weight:700;color:var(--accent);}
    .stat-label{font-size:12px;color:var(--muted);margin-top:4px;}
    .more-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
    .mini-stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
    .mini-label{font-size:13px;color:var(--muted);}
    .mini-val{font-family:'Space Mono',monospace;font-size:14px;color:var(--text);}
    .textarea-wrap{position:relative;}
    textarea{width:100%;min-height:280px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.7;padding:20px;border-radius:14px;outline:none;resize:vertical;transition:border-color 0.2s;}
    textarea:focus{border-color:var(--accent);}
    textarea::placeholder{color:var(--muted);}
    .btn-row{display:flex;gap:10px;margin-top:12px;}
    .clear-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:12px;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all 0.2s;}
    .clear-btn:hover{border-color:var(--accent);color:var(--accent);}
    footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:24px;text-align:center;font-size:13px;color:var(--muted);}
    footer a{color:var(--accent);text-decoration:none;}
    @media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr);}.more-stats{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<header><div class="header-inner">
  <a href="index.html" class="logo">TechFixZone <span class="logo-badge">TOOLS</span></a>
  <a href="index.html" class="back-link">← All Tools</a>
</div></header>
<div class="page">
  <h1 class="page-title">Word <span>Counter</span></h1>
  <p class="page-desc">Count words, characters, sentences, and paragraphs in real time.</p>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" id="words">0</div><div class="stat-label">Words</div></div>
    <div class="stat-card"><div class="stat-num" id="chars">0</div><div class="stat-label">Characters</div></div>
    <div class="stat-card"><div class="stat-num" id="sentences">0</div><div class="stat-label">Sentences</div></div>
    <div class="stat-card"><div class="stat-num" id="paragraphs">0</div><div class="stat-label">Paragraphs</div></div>
  </div>
  <div class="more-stats">
    <div class="mini-stat"><span class="mini-label">Characters (no spaces)</span><span class="mini-val" id="charsNoSpace">0</span></div>
    <div class="mini-stat"><span class="mini-label">Reading time</span><span class="mini-val" id="readTime">0 min</span></div>
    <div class="mini-stat"><span class="mini-label">Speaking time</span><span class="mini-val" id="speakTime">0 min</span></div>
  </div>
  <div class="textarea-wrap">
    <textarea id="inputText" placeholder="Start typing or paste your text here..." oninput="analyze()"></textarea>
  </div>
  <div class="btn-row">
    <button class="clear-btn" onclick="clearText()">Clear Text</button>
  </div>
</div>
<footer><a href="index.html">← Back to All Tools</a> &nbsp;|&nbsp; Free tools by <a href="https://www.techfixzone.com" target="_blank">TechFixZone.com</a></footer>
<script>
function analyze(){
  const txt=document.getElementById('inputText').value;
  const words=txt.trim()===''?0:txt.trim().split(/\s+/).filter(w=>w.length>0).length;
  const chars=txt.length;
  const charsNoSpace=txt.replace(/\s/g,'').length;
  const sentences=txt.trim()===''?0:txt.split(/[.!?]+/).filter(s=>s.trim().length>0).length;
  const paragraphs=txt.trim()===''?0:txt.split(/\n\s*\n/).filter(p=>p.trim().length>0).length||1;
  const readMin=Math.ceil(words/238);
  const speakMin=Math.ceil(words/130);
  document.getElementById('words').textContent=words.toLocaleString();
  document.getElementById('chars').textContent=chars.toLocaleString();
  document.getElementById('charsNoSpace').textContent=charsNoSpace.toLocaleString();
  document.getElementById('sentences').textContent=sentences.toLocaleString();
  document.getElementById('paragraphs').textContent=paragraphs.toLocaleString();
  document.getElementById('readTime').textContent=words===0?'0 min':readMin+' min';
  document.getElementById('speakTime').textContent=words===0?'0 min':speakMin+' min';
}
function clearText(){document.getElementById('inputText').value='';analyze();}
</script>
</body></html>
