<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Shadow Generator — TechFixZone Tools</title>
  <meta name="description" content="Free CSS box shadow generator with live preview. Copy the CSS code instantly. No signup required." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://techfixzone-hub.github.io/Tools/box-shadow-generator.html" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0a0a0f;--border:#1e1e2e;--accent:#00e5ff;--text:#e2e2f0;--muted:#6b6b8a;--card:#13131c; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
    header{position:relative;z-index:10;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);padding:0 24px;}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
    .logo{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
    .logo-badge{background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
    .back-link{font-size:13px;color:var(--muted);text-decoration:none;font-family:'Space Mono',monospace;transition:color 0.2s;}
    .back-link:hover{color:var(--accent);}
    .page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:40px 24px 80px;}
    .page-title{font-family:'Space Mono',monospace;font-size:clamp(22px,4vw,36px);font-weight:700;color:#fff;margin-bottom:8px;}
    .page-title span{color:var(--accent);}
    .page-desc{font-size:15px;color:var(--muted);margin-bottom:36px;}
    .tool-layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}
    .controls{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px;}
    .ctrl-label{display:block;font-size:12px;font-family:'Space Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
    .slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .sl{font-size:12px;color:var(--muted);min-width:75px;}
    input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border-radius:50%;cursor:pointer;}
    .sv{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);min-width:42px;text-align:right;}
    .color-row{display:flex;align-items:center;gap:10px;}
    input[type=color]{width:44px;height:36px;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;padding:2px;}
    .hex-input{font-family:'Space Mono',monospace;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;width:110px;}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;}
    .toggle-label{font-size:14px;color:var(--text);}
    .toggle{position:relative;width:40px;height:22px;}
    .toggle input{opacity:0;width:0;height:0;}
    .tslider{position:absolute;inset:0;background:var(--border);border-radius:22px;cursor:pointer;transition:0.2s;}
    .tslider:before{content:'';position:absolute;width:16px;height:16px;background:white;border-radius:50%;left:3px;top:3px;transition:0.2s;}
    .toggle input:checked+.tslider{background:var(--accent);}
    .toggle input:checked+.tslider:before{transform:translateX(18px);}
    .preview-section{display:flex;flex-direction:column;gap:20px;}
    .preview-box{width:100%;height:280px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;}
    .preview-el{width:140px;height:140px;background:#1a1a28;border-radius:12px;transition:box-shadow 0.2s;}
    .output-box{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .output-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
    .output-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .copy-btn{background:var(--accent);color:#000;border:none;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:6px 14px;border-radius:6px;cursor:pointer;}
    .copy-btn.copied{background:#00ff88;}
    .output-code{padding:16px 18px;font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);line-height:1.6;word-break:break-all;white-space:pre-wrap;min-height:60px;}
    footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:24px;text-align:center;font-size:13px;color:var(--muted);}
    footer a{color:var(--accent);text-decoration:none;}
    @media(max-width:768px){.tool-layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<header><div class="header-inner">
  <a href="index.html" class="logo">TechFixZone <span class="logo-badge">TOOLS</span></a>
  <a href="index.html" class="back-link">← All Tools</a>
</div></header>
<div class="page">
  <h1 class="page-title">Box <span>Shadow</span> Generator</h1>
  <p class="page-desc">Design custom CSS box shadows with live preview. Copy code instantly.</p>
  <div class="tool-layout">
    <div class="controls">
      <div><span class="ctrl-label">Shadow Settings</span>
        <div class="slider-row"><span class="sl">Horizontal</span><input type="range" min="-50" max="50" value="5" id="h" oninput="upd()"/><span class="sv" id="hv">5px</span></div>
        <div class="slider-row"><span class="sl">Vertical</span><input type="range" min="-50" max="50" value="5" id="v" oninput="upd()"/><span class="sv" id="vv">5px</span></div>
        <div class="slider-row"><span class="sl">Blur</span><input type="range" min="0" max="100" value="20" id="bl" oninput="upd()"/><span class="sv" id="blv">20px</span></div>
        <div class="slider-row"><span class="sl">Spread</span><input type="range" min="-50" max="50" value="0" id="sp" oninput="upd()"/><span class="sv" id="spv">0px</span></div>
        <div class="slider-row"><span class="sl">Opacity</span><input type="range" min="0" max="100" value="50" id="op" oninput="upd()"/><span class="sv" id="opv">50%</span></div>
      </div>
      <div><span class="ctrl-label">Color</span>
        <div class="color-row">
          <input type="color" id="sc" value="#00e5ff" oninput="document.getElementById('sh').value=this.value;upd()"/>
          <input type="text" class="hex-input" id="sh" value="#00e5ff" oninput="if(/^#[0-9A-Fa-f]{6}$/.test(this.value)){document.getElementById('sc').value=this.value;upd()}"/>
        </div>
      </div>
      <div><span class="ctrl-label">Options</span>
        <div class="toggle-row"><span class="toggle-label">Inset Shadow</span>
          <label class="toggle"><input type="checkbox" id="ins" onchange="upd()"/><span class="tslider"></span></label>
        </div>
      </div>
    </div>
    <div class="preview-section">
      <div class="preview-box"><div class="preview-el" id="pel"></div></div>
      <div class="output-box">
        <div class="output-header"><span class="output-label">CSS Code</span><button class="copy-btn" id="cb" onclick="copyCSS()">Copy CSS</button></div>
        <div class="output-code" id="oc"></div>
      </div>
    </div>
  </div>
</div>
<footer><a href="index.html">← Back to All Tools</a> &nbsp;|&nbsp; Free tools by <a href="https://www.techfixzone.com" target="_blank">TechFixZone.com</a></footer>
<script>
function upd(){
  const h=document.getElementById('h').value,v=document.getElementById('v').value,
  bl=document.getElementById('bl').value,sp=document.getElementById('sp').value,
  op=document.getElementById('op').value/100,ins=document.getElementById('ins').checked?'inset ':'',
  hex=document.getElementById('sc').value,
  r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  document.getElementById('hv').textContent=h+'px';
  document.getElementById('vv').textContent=v+'px';
  document.getElementById('blv').textContent=bl+'px';
  document.getElementById('spv').textContent=sp+'px';
  document.getElementById('opv').textContent=Math.round(op*100)+'%';
  const s=`${ins}${h}px ${v}px ${bl}px ${sp}px rgba(${r},${g},${b},${op.toFixed(2)})`;
  document.getElementById('pel').style.boxShadow=s;
  document.getElementById('oc').textContent=`box-shadow: ${s};`;
}
function copyCSS(){
  navigator.clipboard.writeText(document.getElementById('oc').textContent).then(()=>{
    const b=document.getElementById('cb');b.textContent='Copied!';b.classList.add('copied');
    setTimeout(()=>{b.textContent='Copy CSS';b.classList.remove('copied');},2000);
  });
}
upd();
</script>
</body></html>
