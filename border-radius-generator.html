<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Border Radius Generator — TechFixZone Tools</title>
  <meta name="description" content="Free CSS border radius generator. Design rounded corners visually and copy the CSS instantly."/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://techfixzone-hub.github.io/Tools/border-radius-generator.html"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--border:#1e1e2e;--accent:#00e5ff;--text:#e2e2f0;--muted:#6b6b8a;--card:#13131c;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
    header{position:relative;z-index:10;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);padding:0 24px;}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
    .logo{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
    .logo-badge{background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
    .back-link{font-size:13px;color:var(--muted);text-decoration:none;font-family:'Space Mono',monospace;}
    .back-link:hover{color:var(--accent);}
    .page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:40px 24px 80px;}
    .page-title{font-family:'Space Mono',monospace;font-size:clamp(22px,4vw,36px);font-weight:700;color:#fff;margin-bottom:8px;}
    .page-title span{color:var(--accent);}
    .page-desc{font-size:15px;color:var(--muted);margin-bottom:36px;}
    .tool-layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}
    .controls{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;}
    .ctrl-label{display:block;font-size:12px;font-family:'Space Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .corner-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .corner-item label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
    .corner-item input[type=range]{width:100%;-webkit-appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none;}
    .corner-item input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border-radius:50%;cursor:pointer;}
    .corner-val{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);margin-top:4px;}
    .all-row{display:flex;align-items:center;gap:10px;}
    .all-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none;}
    .all-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border-radius:50%;cursor:pointer;}
    .all-val{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);min-width:40px;text-align:right;}
    .preview-section{display:flex;flex-direction:column;gap:20px;}
    .preview-box{width:100%;height:280px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;}
    .preview-el{width:160px;height:160px;background:linear-gradient(135deg,#00e5ff,#7c3aed);transition:border-radius 0.2s;}
    .output-box{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .output-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
    .output-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .copy-btn{background:var(--accent);color:#000;border:none;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:6px 14px;border-radius:6px;cursor:pointer;}
    .copy-btn.copied{background:#00ff88;}
    .output-code{padding:16px 18px;font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);line-height:1.6;word-break:break-all;white-space:pre-wrap;min-height:60px;}
    footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:24px;text-align:center;font-size:13px;color:var(--muted);}
    footer a{color:var(--accent);text-decoration:none;}
    @media(max-width:768px){.tool-layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<header><div class="header-inner">
  <a href="index.html" class="logo">TechFixZone <span class="logo-badge">TOOLS</span></a>
  <a href="index.html" class="back-link">← All Tools</a>
</div></header>
<div class="page">
  <h1 class="page-title">Border <span>Radius</span> Generator</h1>
  <p class="page-desc">Visually design rounded corners and get the exact CSS values instantly.</p>
  <div class="tool-layout">
    <div class="controls">
      <div><span class="ctrl-label">All Corners</span>
        <div class="all-row">
          <input type="range" min="0" max="50" value="12" id="all" oninput="setAll(this.value)"/>
          <span class="all-val" id="allv">12px</span>
        </div>
      </div>
      <div><span class="ctrl-label">Individual Corners</span>
        <div class="corner-grid">
          <div class="corner-item"><label>Top Left</label><input type="range" min="0" max="100" value="12" id="tl" oninput="upd()"/><div class="corner-val" id="tlv">12px</div></div>
          <div class="corner-item"><label>Top Right</label><input type="range" min="0" max="100" value="12" id="tr" oninput="upd()"/><div class="corner-val" id="trv">12px</div></div>
          <div class="corner-item"><label>Bottom Left</label><input type="range" min="0" max="100" value="12" id="bl" oninput="upd()"/><div class="corner-val" id="blv">12px</div></div>
          <div class="corner-item"><label>Bottom Right</label><input type="range" min="0" max="100" value="12" id="br" oninput="upd()"/><div class="corner-val" id="brv">12px</div></div>
        </div>
      </div>
    </div>
    <div class="preview-section">
      <div class="preview-box"><div class="preview-el" id="pel"></div></div>
      <div class="output-box">
        <div class="output-header"><span class="output-label">CSS Code</span><button class="copy-btn" id="cb" onclick="copyCSS()">Copy CSS</button></div>
        <div class="output-code" id="oc"></div>
      </div>
    </div>
  </div>
</div>
<footer><a href="index.html">← Back to All Tools</a> &nbsp;|&nbsp; Free tools by <a href="https://www.techfixzone.com" target="_blank">TechFixZone.com</a></footer>
<script>
function setAll(v){
  ['tl','tr','bl','br'].forEach(id=>document.getElementById(id).value=v);
  document.getElementById('allv').textContent=v+'px';upd();
}
function upd(){
  const tl=document.getElementById('tl').value,tr=document.getElementById('tr').value,
  bl=document.getElementById('bl').value,br=document.getElementById('br').value;
  document.getElementById('tlv').textContent=tl+'px';document.getElementById('trv').textContent=tr+'px';
  document.getElementById('blv').textContent=bl+'px';document.getElementById('brv').textContent=br+'px';
  const r=`${tl}px ${tr}px ${br}px ${bl}px`;
  document.getElementById('pel').style.borderRadius=r;
  document.getElementById('oc').textContent=`border-radius: ${r};`;
}
function copyCSS(){
  navigator.clipboard.writeText(document.getElementById('oc').textContent).then(()=>{
    const b=document.getElementById('cb');b.textContent='Copied!';b.classList.add('copied');
    setTimeout(()=>{b.textContent='Copy CSS';b.classList.remove('copied');},2000);
  });
}
upd();
</script>
</body></html>
