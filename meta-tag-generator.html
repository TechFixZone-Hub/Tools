<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meta Tag Generator — TechFixZone Tools</title>
  <meta name="description" content="Free meta tag generator. Generate SEO, Open Graph, and Twitter Card meta tags instantly. No signup required."/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://techfixzone-hub.github.io/Tools/meta-tag-generator.html"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--border:#1e1e2e;--accent:#00e5ff;--text:#e2e2f0;--muted:#6b6b8a;--card:#13131c;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
    header{position:relative;z-index:10;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);padding:0 24px;}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
    .logo{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
    .logo-badge{background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
    .back-link{font-size:13px;color:var(--muted);text-decoration:none;font-family:'Space Mono',monospace;}
    .back-link:hover{color:var(--accent);}
    .page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 24px 80px;}
    .page-title{font-family:'Space Mono',monospace;font-size:clamp(22px,4vw,36px);font-weight:700;color:#fff;margin-bottom:8px;}
    .page-title span{color:var(--accent);}
    .page-desc{font-size:15px;color:var(--muted);margin-bottom:36px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-group.full{grid-column:1/-1;}
    .form-group label{font-size:12px;font-family:'Space Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .form-group input,.form-group select,.form-group textarea{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;border-radius:8px;outline:none;transition:border-color 0.2s;}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);}
    .form-group textarea{resize:vertical;min-height:80px;}
    .form-group select option{background:#1a1a28;}
    .char-count{font-size:11px;color:var(--muted);text-align:right;}
    .char-count.warn{color:#ff6b35;}
    .generate-btn{background:var(--accent);color:#000;border:none;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;padding:12px 28px;border-radius:8px;cursor:pointer;transition:opacity 0.2s;margin-bottom:24px;}
    .generate-btn:hover{opacity:0.85;}
    .output-box{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .output-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
    .output-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .copy-btn{background:var(--accent);color:#000;border:none;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:6px 14px;border-radius:6px;cursor:pointer;}
    .copy-btn.copied{background:#00ff88;}
    .output-code{padding:16px 18px;font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);line-height:1.8;word-break:break-all;white-space:pre-wrap;min-height:100px;}
    .section-title{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:24px;text-align:center;font-size:13px;color:var(--muted);}
    footer a{color:var(--accent);text-decoration:none;}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<header><div class="header-inner">
  <a href="index.html" class="logo">TechFixZone <span class="logo-badge">TOOLS</span></a>
  <a href="index.html" class="back-link">← All Tools</a>
</div></header>
<div class="page">
  <h1 class="page-title">Meta Tag <span>Generator</span></h1>
  <p class="page-desc">Generate complete SEO, Open Graph, and Twitter Card meta tags instantly.</p>

  <div class="section-title">Basic SEO</div>
  <div class="form-grid">
    <div class="form-group full"><label>Page Title <span id="titleCount" class="char-count">0/60</span></label>
      <input type="text" id="title" placeholder="Your page title..." oninput="countChars('title','titleCount',60)"/></div>
    <div class="form-group full"><label>Meta Description <span id="descCount" class="char-count">0/160</span></label>
      <textarea id="desc" placeholder="Your page description..." oninput="countChars('desc','descCount',160)"></textarea></div>
    <div class="form-group"><label>Author</label><input type="text" id="author" placeholder="Author name"/></div>
    <div class="form-group"><label>Keywords</label><input type="text" id="keywords" placeholder="keyword1, keyword2"/></div>
    <div class="form-group"><label>Robots</label>
      <select id="robots"><option value="index, follow">index, follow</option><option value="noindex, follow">noindex, follow</option><option value="index, nofollow">index, nofollow</option><option value="noindex, nofollow">noindex, nofollow</option></select></div>
    <div class="form-group"><label>Language</label>
      <select id="lang"><option value="en">English</option><option value="ur">Urdu</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option></select></div>
  </div>

  <div class="section-title">Open Graph (Social)</div>
  <div class="form-grid">
    <div class="form-group full"><label>Page URL</label><input type="text" id="url" placeholder="https://yoursite.com/page"/></div>
    <div class="form-group full"><label>OG Image URL</label><input type="text" id="ogimg" placeholder="https://yoursite.com/image.jpg"/></div>
    <div class="form-group"><label>OG Type</label>
      <select id="ogtype"><option value="website">website</option><option value="article">article</option><option value="product">product</option></select></div>
    <div class="form-group"><label>Twitter Card</label>
      <select id="twcard"><option value="summary_large_image">summary_large_image</option><option value="summary">summary</option></select></div>
    <div class="form-group"><label>Twitter Site (@handle)</label><input type="text" id="twsite" placeholder="@yourhandle"/></div>
  </div>

  <button class="generate-btn" onclick="generate()">Generate Meta Tags</button>

  <div class="output-box">
    <div class="output-header"><span class="output-label">Generated Meta Tags</span><button class="copy-btn" id="cb" onclick="copyCode()">Copy All</button></div>
    <div class="output-code" id="oc">Fill in the fields above and click Generate.</div>
  </div>
</div>
<footer><a href="index.html">← Back to All Tools</a> &nbsp;|&nbsp; Free tools by <a href="https://www.techfixzone.com" target="_blank">TechFixZone.com</a></footer>
<script>
function countChars(inputId,countId,max){
  const len=document.getElementById(inputId).value.length;
  const el=document.getElementById(countId);
  el.textContent=len+'/'+max;
  el.className='char-count'+(len>max?' warn':'');
}
function g(id){return document.getElementById(id).value.trim();}
function generate(){
  const title=g('title'),desc=g('desc'),author=g('author'),keywords=g('keywords'),
  robots=g('robots'),lang=g('lang'),url=g('url'),ogimg=g('ogimg'),
  ogtype=g('ogtype'),twcard=g('twcard'),twsite=g('twsite');
  let out='<!-- Basic SEO -->\n';
  if(title) out+=`<title>${title}</title>\n<meta name="title" content="${title}">\n`;
  if(desc) out+=`<meta name="description" content="${desc}">\n`;
  if(keywords) out+=`<meta name="keywords" content="${keywords}">\n`;
  if(author) out+=`<meta name="author" content="${author}">\n`;
  out+=`<meta name="robots" content="${robots}">\n`;
  out+=`<meta http-equiv="Content-Language" content="${lang}">\n`;
  out+='\n<!-- Open Graph -->\n';
  out+=`<meta property="og:type" content="${ogtype}">\n`;
  if(title) out+=`<meta property="og:title" content="${title}">\n`;
  if(desc) out+=`<meta property="og:description" content="${desc}">\n`;
  if(url) out+=`<meta property="og:url" content="${url}">\n`;
  if(ogimg) out+=`<meta property="og:image" content="${ogimg}">\n`;
  out+='\n<!-- Twitter Card -->\n';
  out+=`<meta name="twitter:card" content="${twcard}">\n`;
  if(title) out+=`<meta name="twitter:title" content="${title}">\n`;
  if(desc) out+=`<meta name="twitter:description" content="${desc}">\n`;
  if(ogimg) out+=`<meta name="twitter:image" content="${ogimg}">\n`;
  if(twsite) out+=`<meta name="twitter:site" content="${twsite}">\n`;
  document.getElementById('oc').textContent=out;
}
function copyCode(){
  const txt=document.getElementById('oc').textContent;
  if(txt==='Fill in the fields above and click Generate.')return;
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById('cb');b.textContent='Copied!';b.classList.add('copied');
    setTimeout(()=>{b.textContent='Copy All';b.classList.remove('copied');},2000);
  });
}
</script>
</body></html>
