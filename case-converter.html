<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Case Converter — TechFixZone Tools</title>
  <meta name="description" content="Free online case converter. Convert text to uppercase, lowercase, title case, sentence case, camelCase, and more instantly."/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://techfixzone-hub.github.io/Tools/case-converter.html"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--border:#1e1e2e;--accent:#00e5ff;--text:#e2e2f0;--muted:#6b6b8a;--card:#13131c;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
    header{position:relative;z-index:10;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);padding:0 24px;}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
    .logo{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
    .logo-badge{background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
    .back-link{font-size:13px;color:var(--muted);text-decoration:none;font-family:'Space Mono',monospace;}
    .back-link:hover{color:var(--accent);}
    .page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 24px 80px;}
    .page-title{font-family:'Space Mono',monospace;font-size:clamp(22px,4vw,36px);font-weight:700;color:#fff;margin-bottom:8px;}
    .page-title span{color:var(--accent);}
    .page-desc{font-size:15px;color:var(--muted);margin-bottom:36px;}
    .buttons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px;}
    .case-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:10px 14px;border-radius:8px;cursor:pointer;transition:all 0.2s;text-align:left;}
    .case-btn:hover{border-color:var(--accent);color:var(--accent);}
    .case-btn.active{border-color:var(--accent);background:rgba(0,229,255,0.08);color:var(--accent);}
    .case-btn .cb-name{display:block;font-size:13px;}
    .case-btn .cb-example{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-family:'Space Mono',monospace;}
    textarea{width:100%;min-height:180px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.7;padding:20px;border-radius:14px;outline:none;resize:vertical;transition:border-color 0.2s;}
    textarea:focus{border-color:var(--accent);}
    textarea::placeholder{color:var(--muted);}
    .section-sep{height:1px;background:var(--border);margin:20px 0;}
    .output-wrap{position:relative;}
    .output-text{width:100%;min-height:180px;background:var(--card);border:1px solid var(--border);color:#00ff88;font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.7;padding:20px;border-radius:14px;resize:vertical;}
    .btn-row{display:flex;gap:10px;margin-top:12px;}
    .action-btn{background:var(--accent);color:#000;border:none;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;}
    .action-btn.copied{background:#00ff88;}
    .clear-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:12px;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all 0.2s;}
    .clear-btn:hover{border-color:var(--accent);color:var(--accent);}
    footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:24px;text-align:center;font-size:13px;color:var(--muted);}
    footer a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
<header><div class="header-inner">
  <a href="index.html" class="logo">TechFixZone <span class="logo-badge">TOOLS</span></a>
  <a href="index.html" class="back-link">← All Tools</a>
</div></header>
<div class="page">
  <h1 class="page-title">Case <span>Converter</span></h1>
  <p class="page-desc">Convert text to any case format instantly. Select a case type and type or paste your text.</p>
  <div class="buttons-grid">
    <button class="case-btn active" onclick="setCase('upper',this)"><span class="cb-name">UPPERCASE</span><span class="cb-example">HELLO WORLD</span></button>
    <button class="case-btn" onclick="setCase('lower',this)"><span class="cb-name">lowercase</span><span class="cb-example">hello world</span></button>
    <button class="case-btn" onclick="setCase('title',this)"><span class="cb-name">Title Case</span><span class="cb-example">Hello World</span></button>
    <button class="case-btn" onclick="setCase('sentence',this)"><span class="cb-name">Sentence case</span><span class="cb-example">Hello world</span></button>
    <button class="case-btn" onclick="setCase('camel',this)"><span class="cb-name">camelCase</span><span class="cb-example">helloWorld</span></button>
    <button class="case-btn" onclick="setCase('pascal',this)"><span class="cb-name">PascalCase</span><span class="cb-example">HelloWorld</span></button>
    <button class="case-btn" onclick="setCase('snake',this)"><span class="cb-name">snake_case</span><span class="cb-example">hello_world</span></button>
    <button class="case-btn" onclick="setCase('kebab',this)"><span class="cb-name">kebab-case</span><span class="cb-example">hello-world</span></button>
    <button class="case-btn" onclick="setCase('alternate',this)"><span class="cb-name">aLtErNaTe</span><span class="cb-example">hElLo WoRlD</span></button>
    <button class="case-btn" onclick="setCase('inverse',this)"><span class="cb-name">iNVERSE cASE</span><span class="cb-example">hELLO wORLD</span></button>
  </div>
  <textarea id="inputText" placeholder="Type or paste your text here..." oninput="convert()"></textarea>
  <div class="section-sep"></div>
  <textarea class="output-text" id="outputText" readonly placeholder="Converted text will appear here..."></textarea>
  <div class="btn-row">
    <button class="action-btn" id="copyBtn" onclick="copyOutput()">Copy Result</button>
    <button class="clear-btn" onclick="clearAll()">Clear</button>
  </div>
</div>
<footer><a href="index.html">← Back to All Tools</a> &nbsp;|&nbsp; Free tools by <a href="https://www.techfixzone.com" target="_blank">TechFixZone.com</a></footer>
<script>
let currentCase='upper';
function setCase(type,btn){
  currentCase=type;
  document.querySelectorAll('.case-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');convert();
}
function convert(){
  const txt=document.getElementById('inputText').value;
  let result='';
  switch(currentCase){
    case 'upper':result=txt.toUpperCase();break;
    case 'lower':result=txt.toLowerCase();break;
    case 'title':result=txt.toLowerCase().replace(/(?:^|\s)\S/g,a=>a.toUpperCase());break;
    case 'sentence':result=txt.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g,c=>c.toUpperCase());break;
    case 'camel':result=txt.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,(m,c)=>c.toUpperCase());break;
    case 'pascal':result=txt.toLowerCase().replace(/(^|[^a-zA-Z0-9]+)(.)/g,(m,s,c)=>c.toUpperCase());break;
    case 'snake':result=txt.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');break;
    case 'kebab':result=txt.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');break;
    case 'alternate':result=txt.split('').map((c,i)=>i%2===0?c.toLowerCase():c.toUpperCase()).join('');break;
    case 'inverse':result=txt.split('').map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('');break;
  }
  document.getElementById('outputText').value=result;
}
function copyOutput(){
  const txt=document.getElementById('outputText').value;
  if(!txt)return;
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById('copyBtn');b.textContent='Copied!';b.classList.add('copied');
    setTimeout(()=>{b.textContent='Copy Result';b.classList.remove('copied');},2000);
  });
}
function clearAll(){document.getElementById('inputText').value='';document.getElementById('outputText').value='';}
</script>
</body></html>
