<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lorem Ipsum Generator — TechFixZone Tools</title>
  <meta name="description" content="Free Lorem Ipsum generator. Generate dummy placeholder text by words, sentences, or paragraphs instantly."/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://techfixzone-hub.github.io/Tools/lorem-ipsum-generator.html"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--border:#1e1e2e;--accent:#00e5ff;--text:#e2e2f0;--muted:#6b6b8a;--card:#13131c;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
    header{position:relative;z-index:10;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);padding:0 24px;}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
    .logo{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;}
    .logo-badge{background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
    .back-link{font-size:13px;color:var(--muted);text-decoration:none;font-family:'Space Mono',monospace;}
    .back-link:hover{color:var(--accent);}
    .page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 24px 80px;}
    .page-title{font-family:'Space Mono',monospace;font-size:clamp(22px,4vw,36px);font-weight:700;color:#fff;margin-bottom:8px;}
    .page-title span{color:var(--accent);}
    .page-desc{font-size:15px;color:var(--muted);margin-bottom:36px;}
    .controls-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;}
    .ctrl{display:flex;flex-direction:column;gap:6px;}
    .ctrl label{font-size:12px;font-family:'Space Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .ctrl select,.ctrl input[type=number]{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;border-radius:8px;outline:none;min-width:130px;}
    .ctrl select:focus,.ctrl input[type=number]:focus{border-color:var(--accent);}
    .ctrl select option{background:#1a1a28;}
    .generate-btn{background:var(--accent);color:#000;border:none;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;padding:11px 24px;border-radius:8px;cursor:pointer;transition:opacity 0.2s;}
    .generate-btn:hover{opacity:0.85;}
    .output-box{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .output-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
    .output-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .copy-btn{background:var(--accent);color:#000;border:none;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:6px 14px;border-radius:6px;cursor:pointer;}
    .copy-btn.copied{background:#00ff88;}
    .output-text{padding:20px;font-size:15px;line-height:1.8;color:var(--text);min-height:200px;}
    footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:24px;text-align:center;font-size:13px;color:var(--muted);}
    footer a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
<header><div class="header-inner">
  <a href="index.html" class="logo">TechFixZone <span class="logo-badge">TOOLS</span></a>
  <a href="index.html" class="back-link">← All Tools</a>
</div></header>
<div class="page">
  <h1 class="page-title">Lorem Ipsum <span>Generator</span></h1>
  <p class="page-desc">Generate dummy placeholder text by words, sentences, or paragraphs.</p>
  <div class="controls-row">
    <div class="ctrl"><label>Generate</label>
      <select id="type"><option value="paragraphs">Paragraphs</option><option value="sentences">Sentences</option><option value="words">Words</option></select>
    </div>
    <div class="ctrl"><label>Amount</label>
      <input type="number" id="amount" value="3" min="1" max="50"/>
    </div>
    <button class="generate-btn" onclick="generate()">Generate</button>
  </div>
  <div class="output-box">
    <div class="output-header"><span class="output-label">Generated Text</span><button class="copy-btn" id="cb" onclick="copyText()">Copy Text</button></div>
    <div class="output-text" id="ot">Click Generate to create Lorem Ipsum text.</div>
  </div>
</div>
<footer><a href="index.html">← Back to All Tools</a> &nbsp;|&nbsp; Free tools by <a href="https://www.techfixzone.com" target="_blank">TechFixZone.com</a></footer>
<script>
const words=['lorem','ipsum','dolor','sit','amet','consectetur','adipiscing','elit','sed','do','eiusmod','tempor','incididunt','ut','labore','et','dolore','magna','aliqua','enim','ad','minim','veniam','quis','nostrud','exercitation','ullamco','laboris','nisi','aliquip','ex','ea','commodo','consequat','duis','aute','irure','in','reprehenderit','voluptate','velit','esse','cillum','fugiat','nulla','pariatur','excepteur','sint','occaecat','cupidatat','non','proident','sunt','culpa','qui','officia','deserunt','mollit','anim','id','est','laborum','curabitur','pretium','tincidunt','lacus','nunc','purus','facilisis','sem','malesuada'];
function randWord(){return words[Math.floor(Math.random()*words.length)];}
function randSentence(){const len=Math.floor(Math.random()*10)+8;let s=[];for(let i=0;i<len;i++)s.push(randWord());return s[0].charAt(0).toUpperCase()+s[0].slice(1)+' '+s.slice(1).join(' ')+'.';}
function randParagraph(){const len=Math.floor(Math.random()*3)+4;let sentences=[];for(let i=0;i<len;i++)sentences.push(randSentence());return sentences.join(' ');}
function generate(){
  const type=document.getElementById('type').value;
  const amount=Math.min(parseInt(document.getElementById('amount').value)||3,50);
  let result='';
  if(type==='words'){let w=[];for(let i=0;i<amount;i++)w.push(randWord());result=w.join(' ')+'.';}
  else if(type==='sentences'){let s=[];for(let i=0;i<amount;i++)s.push(randSentence());result=s.join(' ');}
  else{let p=[];for(let i=0;i<amount;i++)p.push(randParagraph());result=p.join('\n\n');}
  document.getElementById('ot').textContent=result;
}
function copyText(){
  const txt=document.getElementById('ot').textContent;
  if(txt==='Click Generate to create Lorem Ipsum text.')return;
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById('cb');b.textContent='Copied!';b.classList.add('copied');
    setTimeout(()=>{b.textContent='Copy Text';b.classList.remove('copied');},2000);
  });
}
generate();
</script>
</body></html>
