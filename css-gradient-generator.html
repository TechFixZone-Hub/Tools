<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Gradient Generator — TechFixZone Tools</title>
  <meta name="description" content="Free online CSS gradient generator. Create beautiful linear and radial gradients visually and copy the CSS code instantly. No signup required." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://techfixzone-hub.github.io/Tools/css-gradient-generator.html" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #00e5ff;
      --text: #e2e2f0;
      --muted: #6b6b8a;
      --card: #13131c;
      --card-hover: #1a1a28;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* HEADER */
    header {
      position: relative;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(12px);
      padding: 0 24px;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      background: var(--accent);
      color: #000;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .back-link {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      font-family: 'Space Mono', monospace;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    /* PAGE */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .page-title {
      font-family: 'Space Mono', monospace;
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .page-title span { color: var(--accent); }
    .page-desc {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 36px;
    }

    /* MAIN LAYOUT */
    .tool-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* CONTROLS */
    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .control-group label {
      display: block;
      font-size: 12px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    /* Type buttons */
    .type-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .type-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .type-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,229,255,0.05);
    }

    /* Angle */
    .angle-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }
    .angle-val {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      min-width: 40px;
      text-align: right;
    }

    /* Color stops */
    .color-stops {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .color-stop {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-stop input[type="color"] {
      width: 40px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: none;
      cursor: pointer;
      padding: 2px;
    }
    .color-stop input[type="range"] {
      flex: 1;
    }
    .stop-val {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      min-width: 36px;
      text-align: right;
    }
    .remove-stop {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .remove-stop:hover {
      border-color: #ff2d78;
      color: #ff2d78;
    }
    .add-stop-btn {
      background: none;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .add-stop-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* PREVIEW */
    .preview-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .preview-box {
      width: 100%;
      height: 280px;
      border-radius: 14px;
      border: 1px solid var(--border);
      transition: background 0.2s;
    }

    /* CSS Output */
    .output-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .output-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .copy-btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
      letter-spacing: 0.5px;
    }
    .copy-btn:hover { opacity: 0.85; }
    .copy-btn.copied {
      background: #00ff88;
    }
    .output-code {
      padding: 16px 18px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-wrap;
      min-height: 80px;
    }

    /* Presets */
    .presets-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .preset {
      height: 44px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .preset:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .tool-layout {
        grid-template-columns: 1fr;
      }
      .presets-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      TechFixZone <span class="logo-badge">TOOLS</span>
    </a>
    <a href="index.html" class="back-link">← All Tools</a>
  </div>
</header>

<div class="page">
  <h1 class="page-title">CSS <span>Gradient</span> Generator</h1>
  <p class="page-desc">Create beautiful gradients visually and copy the CSS code instantly. No signup required.</p>

  <div class="tool-layout">

    <!-- CONTROLS -->
    <div class="controls">

      <div class="control-group">
        <label>Gradient Type</label>
        <div class="type-buttons">
          <button class="type-btn active" onclick="setType('linear', this)">Linear</button>
          <button class="type-btn" onclick="setType('radial', this)">Radial</button>
        </div>
      </div>

      <div class="control-group" id="angleGroup">
        <label>Angle</label>
        <div class="angle-wrap">
          <input type="range" id="angleSlider" min="0" max="360" value="135" oninput="updateAngle(this.value)" />
          <span class="angle-val" id="angleVal">135°</span>
        </div>
      </div>

      <div class="control-group">
        <label>Color Stops</label>
        <div class="color-stops" id="colorStops"></div>
        <button class="add-stop-btn" onclick="addStop()">+ Add Color Stop</button>
      </div>

      <div class="control-group">
        <label>Presets</label>
        <div class="presets-grid" id="presetsGrid"></div>
      </div>

    </div>

    <!-- PREVIEW + OUTPUT -->
    <div class="preview-section">
      <div class="preview-box" id="previewBox"></div>

      <div class="output-box">
        <div class="output-header">
          <span class="output-label">CSS Code</span>
          <button class="copy-btn" id="copyBtn" onclick="copyCSS()">Copy CSS</button>
        </div>
        <div class="output-code" id="outputCode"></div>
      </div>
    </div>

  </div>
</div>

<footer>
  <a href="index.html">← Back to All Tools</a> &nbsp;|&nbsp;
  Free tools by <a href="https://www.techfixzone.com" target="_blank">TechFixZone.com</a>
</footer>

<script>
  let gradientType = 'linear';
  let angle = 135;
  let stops = [
    { color: '#00e5ff', position: 0 },
    { color: '#7c3aed', position: 100 }
  ];

  const presets = [
    [{ color: '#00e5ff', position: 0 }, { color: '#7c3aed', position: 100 }],
    [{ color: '#ff6b35', position: 0 }, { color: '#ff2d78', position: 100 }],
    [{ color: '#00ff88', position: 0 }, { color: '#00e5ff', position: 100 }],
    [{ color: '#f7971e', position: 0 }, { color: '#ffd200', position: 100 }],
    [{ color: '#1a1a2e', position: 0 }, { color: '#16213e', position: 50 }, { color: '#0f3460', position: 100 }],
    [{ color: '#ee0979', position: 0 }, { color: '#ff6a00', position: 100 }],
    [{ color: '#8360c3', position: 0 }, { color: '#2ebf91', position: 100 }],
    [{ color: '#fc5c7d', position: 0 }, { color: '#6a3093', position: 100 }],
    [{ color: '#11998e', position: 0 }, { color: '#38ef7d', position: 100 }],
    [{ color: '#c94b4b', position: 0 }, { color: '#4b134f', position: 100 }],
  ];

  function buildGradientCSS() {
    const sortedStops = [...stops].sort((a, b) => a.position - b.position);
    const stopsStr = sortedStops.map(s => `${s.color} ${s.position}%`).join(', ');
    if (gradientType === 'linear') {
      return `linear-gradient(${angle}deg, ${stopsStr})`;
    } else {
      return `radial-gradient(circle, ${stopsStr})`;
    }
  }

  function updatePreview() {
    const grad = buildGradientCSS();
    document.getElementById('previewBox').style.background = grad;
    const full = `background: ${grad};\nbackground: -webkit-${grad};`;
    document.getElementById('outputCode').textContent = full;
  }

  function renderStops() {
    const container = document.getElementById('colorStops');
    container.innerHTML = '';
    stops.forEach((stop, i) => {
      const div = document.createElement('div');
      div.className = 'color-stop';
      div.innerHTML = `
        <input type="color" value="${stop.color}" oninput="stops[${i}].color=this.value; updatePreview()" />
        <input type="range" min="0" max="100" value="${stop.position}"
          oninput="stops[${i}].position=parseInt(this.value); document.getElementById('sv${i}').textContent=this.value+'%'; updatePreview()" />
        <span class="stop-val" id="sv${i}">${stop.position}%</span>
        ${stops.length > 2 ? `<button class="remove-stop" onclick="removeStop(${i})">×</button>` : '<div style="width:28px"></div>'}
      `;
      container.appendChild(div);
    });
  }

  function renderPresets() {
    const grid = document.getElementById('presetsGrid');
    grid.innerHTML = '';
    presets.forEach((preset, i) => {
      const div = document.createElement('div');
      div.className = 'preset';
      const stopsStr = preset.map(s => `${s.color} ${s.position}%`).join(', ');
      div.style.background = `linear-gradient(135deg, ${stopsStr})`;
      div.title = `Preset ${i + 1}`;
      div.onclick = () => {
        stops = preset.map(s => ({ ...s }));
        angle = 135;
        document.getElementById('angleSlider').value = 135;
        document.getElementById('angleVal').textContent = '135°';
        renderStops();
        updatePreview();
      };
      grid.appendChild(div);
    });
  }

  function setType(type, btn) {
    gradientType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('angleGroup').style.display = type === 'radial' ? 'none' : 'block';
    updatePreview();
  }

  function updateAngle(val) {
    angle = parseInt(val);
    document.getElementById('angleVal').textContent = val + '°';
    updatePreview();
  }

  function addStop() {
    stops.push({ color: '#ffffff', position: 50 });
    renderStops();
    updatePreview();
  }

  function removeStop(i) {
    stops.splice(i, 1);
    renderStops();
    updatePreview();
  }

  function copyCSS() {
    const code = document.getElementById('outputCode').textContent;
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy CSS';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  // Init
  renderPresets();
  renderStops();
  updatePreview();
</script>

</body>
</html>
